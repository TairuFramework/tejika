packages:
  - packages/*

nodeLinker: hoisted

catalog:
  '@enkaku/client': ^0.21.3
  '@enkaku/http-serve': ^0.21.3
  '@enkaku/protocol': ^0.21.4
  '@enkaku/server': ^0.21.3
  '@enkaku/socket': ^0.21.3
  '@hono/node-server': ^2.1.3
  '@inkjs/ui': ^2.0.0
  '@types/react': ^19.2.18
  '@logtape/file': ^2.3.10
  '@logtape/logtape': ^2.3.10
  '@sozai/lock': ^0.1.1
  '@types/node': ^26.6.4
  commander: ^15.0.0
  env-paths: ^4.0.0
  get-port: ^7.2.0
  hono: ^4.13.12
  ink: ^7.1.1
  ink-testing-library: ^4.0.0
  nano-spawn: ^2.1.0
  node-pty: ^1.1.0
  react: ^19.2.8
  strip-ansi: ^7.2.0

catalogMode: manual

minimumReleaseAgeExclude:
  - '@enkaku/*'
  - '@kigu/*'
  - '@kokuin/*'
  - '@sozai/*'

supportedArchitectures:
  cpu: [ current ]
  os: [ current ]

allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  esbuild: true
  node-pty: true

publishBranch: main

# Every package versions independently: no fixed groups, no lanes, no epics.
versioning:
  changelog:
    storage: repository
